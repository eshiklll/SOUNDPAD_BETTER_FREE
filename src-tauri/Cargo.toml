[package]
name = "soundboard-app"
version = "0.0.0"
description = "A modern soundboard app"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rodio = "0.17"
# rdev = "0.5" # global hotkeys, maybe later
anyhow = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
